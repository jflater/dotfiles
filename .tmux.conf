# ~/.tmux.conf — minimal setup: splits + tab-like windows
 
# Use Ctrl-a as the prefix instead of the default Ctrl-b (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix
 
# Mouse support: click to switch panes, drag to resize, scroll to scroll back
set -g mouse on
 
# Start window/pane numbering at 1 instead of 0 (matches keyboard order)
set -g base-index 1
setw -g pane-base-index 1
 
# Splits: | for vertical, - for horizontal (more intuitive than default % and ")
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %
 
# Pane navigation with vim-style keys (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
 
# Quick window (tab) switching: prefix + Shift-Left/Right to cycle
bind -n M-Left previous-window
bind -n M-Right next-window
 
# Open new window in the same directory as the current pane
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
 
# Bigger scrollback buffer
set -g history-limit 10000
 
# Faster escape time (helps Neovim feel responsive inside tmux)
set -sg escape-time 0
 
# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
 
# Status bar: keep it simple
set -g status-style bg=black,fg=white
set -g status-left "[#S] "
set -g status-right "%H:%M"
