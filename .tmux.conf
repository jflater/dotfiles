# ~/.tmux.conf — minimal setup: splits + tab-like windows
 
# Use Ctrl-a as the prefix instead of the default Ctrl-b (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix
 
# Mouse support: click to switch panes, drag to resize, scroll to scroll back
set -g mouse on
 
# Start window/pane numbering at 1 instead of 0 (matches keyboard order)
set -g base-index 1
setw -g pane-base-index 1
 
# Splits: | for vertical, - for horizontal (more intuitive than default % and ")
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %
 
# Pane navigation with vim-style keys (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
 
# Quick window (tab) switching: prefix + Shift-Left/Right to cycle
bind -n M-Left previous-window
bind -n M-Right next-window
 
# Open new window in the same directory as the current pane
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
 
# Bigger scrollback buffer
set -g history-limit 10000
 
# Faster escape time (helps Neovim feel responsive inside tmux)
set -sg escape-time 0
 
# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Claude Code: without these, Shift+Enter submits instead of inserting a
# newline, and desktop notifications/the progress bar never reach past tmux.
# https://code.claude.com/docs/en/terminal-config#configure-tmux
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# smart-splits.nvim: seamless nav (C-hjkl) and resize (M-hjkl) across the
# nvim/tmux boundary. @pane-is-vim is set by the plugin itself, not here —
# when the focused pane is running nvim, the keystroke is forwarded to it
# instead of moving/resizing the tmux pane. Values copied from the plugin's
# own smart-splits.tmux (its defaults), so nvim-side keys must match.
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'

# Dev layout: prefix + D -> shell pane below (25% height), nvim launches
# above. Claude's pane isn't built here - plugins/claude.lua opens it on
# demand (<leader>ai), splitting off whichever pane nvim is running in.
# Guarded: only runs the split+launch if this pane is at a plain shell
# prompt, so pressing prefix+D while already inside nvim types "nvim" into
# the buffer instead of doing something useful.
bind D if -F '#{m/r:^(bash|zsh|sh)$,#{pane_current_command}}' \
  { split-window -v -l 25% -c "#{pane_current_path}" ; select-pane -U ; send-keys nvim Enter } \
  { display-message "prefix+D: run from a shell prompt, not inside nvim" }

# Status bar: keep it simple
set -g status-style bg=black,fg=white
set -g status-left "[#S] "
set -g status-right "%H:%M"
